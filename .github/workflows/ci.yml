name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + testler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Lambda runtime'i ile aynı sürüm; yereldeki daha yeni bir Python ile
          # ayrışma burada yakalanır.
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format kontrolü
        run: ruff format --check .

      - name: Birim testleri (AWS gerektirmez)
        run: pytest tests/unit

      - name: Entegrasyon testleri (moto ile sahte AWS)
        run: pytest tests/integration -m integration

  infra:
    name: Altyapı (CDK synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CDK CLI
        run: npm install -g aws-cdk

      - name: Bağımlılıklar
        run: pip install -r infra/requirements.txt

      - name: Lambda paketlerini derle
        run: python infra/scripts/build_lambda_packages.py

      - name: cdk synth
        working-directory: infra
        # Bütçe e-postası synth için zorunlu bir bağlam değeri; CI'da yer tutucu.
        run: cdk synth -c budget_alert_email=ci@example.com

  web:
    name: Web (tip + derleme + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Tip kontrolü
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Üretim derlemesi
        run: npm run build
