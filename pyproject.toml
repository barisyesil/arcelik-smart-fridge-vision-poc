[project]
name = "smartfridge"
version = "0.1.0"
description = "Akilli Buzdolabi Envanter Sistemi - Faz 1 PoC"
requires-python = ">=3.12"

# Bilincli tercih: paket olarak kurulmuyoruz. pytest `pythonpath` ile src/'i
# gorur, Lambda paketleme adiminda ise src/ zaten kok dizin olarak zipleniyor.
# Boylece Faz 1'de build/packaging katmani yok.

[tool.pytest.ini_options]
# "src": core/handlers/adapters importları. ".": repo kökü — `playground`
# paketi (yerel Prompt Lab) buradan import edilir. Kök olmadan `pytest
# tests/unit` (CI'daki çağrı; `python -m pytest` değil, CWD'yi eklemez)
# test_playground.py toplamada `ModuleNotFoundError: playground` verir.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: AWS veya ag erisimi gerektirir (varsayilan CI'da calismaz)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "TID",      # tidy-imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# `playground/` repo kökünde bir first-party paket (yerel Prompt Lab dev aracı).
known-first-party = ["playground"]

[tool.ruff.lint.per-file-ignores]
# FastAPI `File(...)`/`Form(...)` argüman varsayılanları framework idiyomudur;
# B008 (varsayılanda fonksiyon çağrısı) burada bilinçli ve doğrudur.
"playground/server.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
